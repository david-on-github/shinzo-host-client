services:
  shinzo-host:
    # :latest is the newest release. Pin to a version (vX.Y.Z) for production.
    image: ghcr.io/shinzonetwork/shinzo-host-client:${SHINZO_HOST_VERSION:-latest}
    container_name: shinzo-host
    restart: unless-stopped
    ports:
      - "80:8080"    # HTTP: health, metrics, registration, DefraDB API (/api/v0/)
      - "9171:9171"  # libp2p P2P
    volumes:
      - data:/app/data
    environment:                 # values come from .env (see .env.sample); unset = built-in default
      - SHINZO_KEY_PASSPHRASE=${SHINZO_KEY_PASSPHRASE:-}
      - SHINZO_NETWORK=${SHINZO_NETWORK:-}
      - BOOTSTRAP_PEERS=${BOOTSTRAP_PEERS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-}

volumes:
  data:
    name: shinzo-host-data   # all node state (database, keys, lens registry). Docker-managed; inspect with `docker volume inspect shinzo-host-data`
